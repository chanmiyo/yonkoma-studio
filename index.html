<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>四コマスタジオ</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F7F7F8;--card:#FFFFFF;--line:#E4E4E7;--ink:#18181B;--sub:#71717A;
--accent:#2563EB;--accent-w:#DBEAFE;--ok:#16A34A;--danger:#DC2626;--r:10px;}
*{box-sizing:border-box;}
body{margin:0;font-family:"Noto Sans JP",-apple-system,system-ui,sans-serif;
 background:var(--bg);color:var(--ink);line-height:1.7;padding-bottom:60px;
 -webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;}
.hdr{background:var(--card);border-bottom:1px solid var(--line);padding:18px 20px;
 position:sticky;top:0;z-index:20;}
.hdr h1{font-size:19px;font-weight:700;margin:0;letter-spacing:.02em;}
.hdr .sub{color:var(--sub);font-size:12.5px;margin-top:2px;}
.wrap{max-width:1080px;margin:0 auto;display:flex;gap:24px;padding:24px 20px 0;align-items:flex-start;}
.work{flex:1 1 auto;min-width:0;}
.side{width:300px;flex:0 0 300px;position:sticky;top:88px;}
@media(max-width:860px){.wrap{flex-direction:column;padding:16px 14px 0;gap:16px;}
 .side{width:100%;flex:none;order:2;}}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
 padding:20px;margin-bottom:16px;}
.card h2{font-size:16px;font-weight:700;margin:0 0 4px;}
.card .lede{color:var(--sub);font-size:13px;margin:0 0 18px;}
label.fl{display:block;color:var(--ink);font-size:13px;font-weight:500;margin:0 0 6px;}
input[type=text],textarea,select{width:100%;background:#fff;border:1px solid var(--line);
 border-radius:8px;color:var(--ink);padding:11px 13px;font-size:15px;line-height:1.6;
 resize:vertical;font-family:inherit;transition:border-color .12s,box-shadow .12s;}
input::placeholder,textarea::placeholder{color:#A1A1AA;}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--accent);
 box-shadow:0 0 0 3px var(--accent-w);}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:11px 18px;
 font-size:14px;font-weight:600;transition:.12s;}
.btn:hover{opacity:.85;} .btn:disabled{opacity:.35;cursor:not-allowed;}
.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--ink);font-weight:500;}
.btn.ghost:hover{background:#FAFAFA;opacity:1;}
.btn.sm{padding:8px 13px;font-size:13px;}
.btn.go{background:var(--accent);width:100%;padding:15px;font-size:16px;}
.btn:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
.koma{border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px;}
.koma .ttl{font-size:14px;font-weight:700;margin-bottom:12px;}
.koma .ttl em{color:var(--sub);font-style:normal;font-weight:400;font-size:12.5px;margin-left:8px;}
.koma textarea,.koma select,.koma input{margin-bottom:12px;}
.cnt{font-size:12px;color:var(--sub);text-align:right;margin:-8px 0 12px;}
.cnt.over{color:var(--danger);font-weight:600;}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px;}
@media(max-width:520px){.grid2{grid-template-columns:1fr;}}
.genko{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px;}
.genko .cap{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;
 color:var(--sub);padding-bottom:10px;margin-bottom:10px;border-bottom:1px solid var(--line);}
.genko .cap b{color:var(--ink);font-weight:600;}
.frame{aspect-ratio:820/600;border:1px solid var(--ink);margin-bottom:5%;position:relative;
 overflow:hidden;background:#fff;display:flex;flex-direction:column;gap:5px;padding:8px;border-radius:2px;}
.frame:last-child{margin-bottom:0;}
.frame.empty{border:1px dashed #D4D4D8;background:#FAFAFA;}
.frame img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.frame .no{position:absolute;right:6px;bottom:3px;color:#A1A1AA;font-size:12px;font-weight:600;z-index:1;}
.fuki{background:#fff;border:1px solid var(--ink);border-radius:10px;font-size:10.5px;
 line-height:1.45;padding:4px 8px;max-width:76%;position:relative;z-index:1;}
.fuki:nth-child(2){align-self:flex-end;}
.frame .art{position:absolute;left:8px;right:8px;bottom:6px;font-size:9.5px;color:#A1A1AA;z-index:0;}
.hint{background:#F4F4F5;border-radius:8px;padding:12px 14px;font-size:13px;color:var(--sub);margin:16px 0 0;}
.err{background:#FEF2F2;border:1px solid #FECACA;border-radius:8px;padding:12px 14px;
 font-size:13.5px;color:#991B1B;margin-top:14px;}
.hide{display:none!important;}
.spin{display:inline-block;width:13px;height:13px;border:2px solid rgba(0,0,0,.15);
 border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
 vertical-align:-2px;margin-right:8px;}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation-duration:2.4s}}
.chk{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;color:var(--ink);
 padding:9px 0;border-bottom:1px solid #F4F4F5;}
.chk input{margin-top:4px;accent-color:var(--accent);flex:none;width:auto;}
.state{font-size:12px;color:var(--sub);text-align:center;margin-top:10px;min-height:16px;}
</style>
</head>
<body>

<div class="hdr">
  <h1>四コマスタジオ</h1>
  <div class="sub">ふむふむ瓦版　820 × 2538px</div>
</div>

<div class="wrap">
<div class="work">

  <div class="card">
    <h2>ネームを起こす</h2>
    <p class="lede">その日あった出来事を、人に話すつもりで書いてください。具体的なほど良いネームになります。</p>
    <div class="grid2">
      <div><label class="fl">号数</label>
        <input type="text" id="issue" placeholder="2026年9月号"></div>
      <div><label class="fl">対象月（季節に反映）</label>
        <input type="text" id="month" placeholder="2026年9月"></div>
    </div>
    <label class="fl">テーマ・出来事</label>
    <textarea id="theme" rows="3" placeholder="例：うしくりーん作戦で集合写真を撮ろうとドローンを用意したら、直前にアップデートが始まってiPhoneで撮った"></textarea>
    <div class="row" style="margin-top:14px">
      <button class="btn go" id="all">一気に版下まで作る</button>
    </div>
    <div id="allState" style="font-size:13.5px;color:#3F3F46;margin-top:12px;min-height:20px"></div>
    <div class="row" style="margin-top:10px">
      <button class="btn ghost sm" id="gen">ネームだけ作る</button>
      <button class="btn ghost sm" id="blank">白紙から書く</button>
    </div>
    <div id="genErr" class="err hide"></div>
  </div>

  <div class="card hide" id="komaCard">
    <h2>ネームを直して、絵にする</h2>
    <p class="lede">セリフは1コマ2つまで、1つ20文字以内。絵の欄に看板や画面の文字を書くと化けるので書かないでください。</p>
    <div id="komaEd"></div>
    <label class="chk" style="border:0;margin-bottom:6px"><input type="checkbox" id="chain" checked>
      前のコマに合わせて描く（服・小道具・背景を引き継ぐ）</label>
    <div class="row">
      <button class="btn" id="drawAll">4コマまとめて描く</button>
      <span id="drawState" style="font-size:12.5px;color:var(--sub)"></span>
    </div>
    <div id="drawErr" class="err hide"></div>
  </div>

  <div class="card hide" id="outCard">
    <h2>版下を書き出す</h2>
    <p class="lede">百先生の原稿と同じ 820 × 2538px に組みます。</p>
    <label class="fl">注釈（コマの間に入る小さな文字・空欄可）</label>
    <input type="text" id="n1" placeholder="1コマ目と2コマ目の間" style="margin-bottom:7px">
    <input type="text" id="n2" placeholder="2コマ目と3コマ目の間" style="margin-bottom:7px">
    <input type="text" id="n3" placeholder="3コマ目と4コマ目の間">
    <div class="row" style="margin-top:14px">
      <label class="chk" style="border:0"><input type="checkbox" id="x2">印刷用に2倍で書き出す</label>
    </div>
    <div class="row" style="margin-top:4px">
      <button class="btn" id="dl" disabled>版下を書き出す</button>
      <span id="dlNote" style="font-size:12.5px;color:var(--sub)"></span>
    </div>
  </div>

  <div class="card hide" id="chkCard">
    <h2>朱入れ</h2>
    <p class="lede">書き出す前にここを見てください。崩れたコマは「描き直す」で引き直せます。</p>
    <div id="checks"></div>
  </div>

</div>

<div class="side">
  <div class="genko">
    <div class="cap"><span id="capIssue">ふむふむ瓦版</span><b>820 × 2538</b></div>
    <div id="sheet"></div>
  </div>
  <div class="state" id="saveState">　</div>
</div>
</div>

<script>
const HOOK='https://hook.eu2.make.com/2zdng4azz3he6q8vexxuyxll3v8rnbyp';
const W=820,PH=600,G=46,BD=3,TH=PH*4+G*3;
const KANJI=['起','承','転','結'];
const SHOTS=['バストアップ','顔のアップ','全身（立ち）','全身（ばんざい）','全身（後ろ姿）'];
const FACES=['基本','笑顔（目を閉じる）','感激・大好き','お願い・上目づかい',
 'じと目・不機嫌','あわてる','メガネ（作業中）','イライラ・怒り'];
const FACE_RULE={
'基本':'小さい黒目をひとつ、向かって右。まつげなし',
'笑顔（目を閉じる）':'目は弧を1本ずつ。うれしい・元気な顔',
'感激・大好き':'両目とも大きな青い瞳、まつげあり。クローバーは中央寄りへ',
'お願い・上目づかい':'片目だけ大きな青い瞳、まつげあり。もう片方はクローバー',
'じと目・不機嫌':'まぶたの水平線で半目。黒目は小さいまま',
'あわてる':'黒目は小さいまま、まつげとハイライトは付けない。汗を足し、口は大きく開ける',
'メガネ（作業中）':'丸メガネをクローバーの上に。黒目はメガネ越しに小さく',
'イライラ・怒り':'じと目を土台に、つり眉を向かって右に1本、口をへの字、こめかみに青い怒りマークを1つ'};
const CHECKS=['クローバーが顔の中央、小さな目が左右に1つずつある','指定した表情になっている',
'口がクローバーより下にある','髪が茶色のきのこ型。ピンクや長髪でない',
'白猫が向かって右上、緑の花が向かって左上','ほっぺのハートが左右にある',
'1.6〜1.7頭身。首が生えていない','指が描かれていない','影やグラデーションがない',
'セリフ以外の文字が絵に入っていない','4コマで絵柄が揃っている'];

let S={issue:'',month:'',theme:'',notes:['','',''],
 koma:[0,1,2,3].map(()=>({art:'',lines:['',''],shot:'バストアップ',face:'基本'}))};
let imgs=[null,null,null,null];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

function save(){try{localStorage.setItem('yonkoma',JSON.stringify(S));
 $('#saveState').textContent='保存しました';
 setTimeout(()=>$('#saveState').textContent='　',1400);}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('yonkoma'));
 if(d){S={...S,...d};$('#issue').value=S.issue||'';$('#month').value=S.month||'';
 $('#theme').value=S.theme||'';$('#n1').value=S.notes[0]||'';$('#n2').value=S.notes[1]||'';
 $('#n3').value=S.notes[2]||'';
 if(S.koma.some(k=>k.art||k.lines.some(Boolean))){show();drawEd();}}}catch(e){}
 render();}
function show(){['#komaCard','#outCard','#chkCard'].forEach(s=>$(s).classList.remove('hide'));}

function render(){
  $('#capIssue').textContent=S.issue||'ふむふむ瓦版';
  const sh=$('#sheet');sh.innerHTML='';
  S.koma.forEach((k,i)=>{
    const f=document.createElement('div');
    const has=imgs[i]||k.art||k.lines.some(Boolean);
    f.className='frame'+(has?'':' empty');
    if(imgs[i]){const im=document.createElement('img');im.src=imgs[i].src;f.appendChild(im);}
    else{k.lines.filter(Boolean).forEach(t=>{const b=document.createElement('div');
      b.className='fuki';b.textContent=t;f.appendChild(b);});
      if(k.art){const a=document.createElement('div');a.className='art';a.textContent=k.art;f.appendChild(a);}}
    const n=document.createElement('span');n.className='no';n.textContent=i+1;f.appendChild(n);
    sh.appendChild(f);
    if(i<3&&S.notes[i]){const g=document.createElement('div');
      g.style.cssText='font-size:8.5px;color:#888;text-align:right;margin:-4.4% 0 4.4%';
      g.textContent=S.notes[i];sh.appendChild(g);}
  });
  const n=imgs.filter(Boolean).length;
  $('#dl').disabled=n<4;
  $('#dlNote').textContent=n<4?`4枚そろうと押せます（いま${n}枚）`:'';
}

function drawEd(){
  const w=$('#komaEd');w.innerHTML='';
  S.koma.forEach((k,i)=>{
    const d=document.createElement('div');d.className='koma';
    d.innerHTML=`<div class="ttl">${i+1}コマ目<em>${KANJI[i]}</em></div>
      <label class="fl">構図</label>
      <select data-k="${i}" data-f="shot">${SHOTS.map(s=>`<option>${s}</option>`).join('')}</select>
      <label class="fl">表情</label>
      <select data-k="${i}" data-f="face">${FACES.map(s=>`<option>${s}</option>`).join('')}</select>
      <label class="fl">絵（看板や画面の文字は書かない）</label>
      <textarea rows="2" data-k="${i}" data-f="art"></textarea>
      <label class="fl">セリフ 1</label><textarea rows="1" data-k="${i}" data-f="0"></textarea>
      <div class="cnt" data-c="${i}-0"></div>
      <label class="fl">セリフ 2（なくてよい）</label><textarea rows="1" data-k="${i}" data-f="1"></textarea>
      <div class="cnt" data-c="${i}-1"></div>
      <div class="row"><button class="btn sm" data-draw="${i}">このコマを描く</button>
      <span class="ks" data-ks="${i}" style="font-size:12.5px;color:#71717A"></span></div>`;
    w.appendChild(d);
    d.querySelector('[data-f=shot]').value=k.shot||'バストアップ';
    d.querySelector('[data-f=face]').value=k.face||'基本';
    d.querySelector('[data-f=art]').value=k.art;
    d.querySelector('[data-f="0"]').value=k.lines[0]||'';
    d.querySelector('[data-f="1"]').value=k.lines[1]||'';
  });
  const upd=e=>{const t=e.target,i=+t.dataset.k,f=t.dataset.f;if(f===undefined)return;
    if(f==='art')S.koma[i].art=t.value;
    else if(f==='shot')S.koma[i].shot=t.value;
    else if(f==='face')S.koma[i].face=t.value;
    else S.koma[i].lines[+f]=t.value;
    count();render();save();};
  w.oninput=upd;w.onchange=upd;
  w.onclick=e=>{const b=e.target.closest('[data-draw]');if(b)drawOne(+b.dataset.draw);};
  count();
}
function count(){$$('[data-c]').forEach(el=>{const [i,j]=el.dataset.c.split('-').map(Number);
  const n=(S.koma[i].lines[j]||'').length;el.textContent=n?`${n} / 20`:'';
  el.classList.toggle('over',n>20);});}

function parseKoma(t){
  const m=t.match(/\[[\s\S]*\]/); const src=m?m[0]:t;
  try{const a=JSON.parse(src);if(Array.isArray(a))return a;}catch(e){}
  try{const a=JSON.parse(src.replace(/,\s*([\]}])/g,'$1'));if(Array.isArray(a))return a;}catch(e){}
  const out=[];
  src.split(/\}\s*,\s*\{/).forEach(b=>{
    const am=b.match(/"art"\s*:\s*"((?:[^"\\]|\\.)*)"/);
    if(!am)return;
    const lb=(b.match(/"lines"\s*:\s*\[([\s\S]*?)\]/)||[])[1]||'';
    const lines=[]; const re=/"((?:[^"\\]|\\.)*)"/g; let x;
    while((x=re.exec(lb))!==null)lines.push(x[1].replace(/\\"/g,'"'));
    out.push({art:am[1].replace(/\\"/g,'"'),lines:[lines[0]||'',lines[1]||'']});
  });
  return out;
}

$('#issue').oninput=e=>{S.issue=e.target.value;render();save();};
$('#month').oninput=e=>{S.month=e.target.value;save();};
$('#theme').oninput=e=>{S.theme=e.target.value;save();};
['n1','n2','n3'].forEach((id,i)=>$('#'+id).oninput=e=>{S.notes[i]=e.target.value;render();save();});
$('#blank').onclick=()=>{show();drawEd();render();};

async function genName(){
  const th=$('#theme').value.trim(),err=$('#genErr');err.classList.add('hide');
  if(!th){err.textContent='テーマを入れてください。';err.classList.remove('hide');return;}
  const b=$('#gen');b.disabled=true;b.innerHTML='<span class="spin"></span>考えています';
  try{
    const u=HOOK+'?theme='+encodeURIComponent(th)+'&month='+encodeURIComponent($('#month').value.trim());
    const r=await fetch(u);
    if(!r.ok)throw new Error('通信に失敗しました（'+r.status+'）');
    let t=(await r.text()).trim();
    if(t==='Accepted')throw new Error('Makeが「Accepted」を返しました。もう一度押してください。');
    t=t.replace(/```json/g,'').replace(/```/g,'').trim();
    const arr=parseKoma(t);
    if(!Array.isArray(arr)||arr.length!==4)throw new Error('4コマ分の形になりませんでした。もう一度押してください。');
    S.koma=arr.map((k,i)=>({art:String(k.art||''),
      lines:[String((k.lines||[])[0]||''),String((k.lines||[])[1]||'')],
      shot:S.koma[i].shot||'バストアップ',face:S.koma[i].face||'基本'}));
    imgs=[null,null,null,null];
    show();drawEd();render();save();
    $('#komaCard').scrollIntoView({behavior:'smooth',block:'start'});
    b.disabled=false;b.textContent='ネームを作る';return true;
  }catch(e){err.textContent=e.message;err.classList.remove('hide');}
  b.disabled=false;b.textContent='ネームを作る';return false;
}
$('#gen').onclick=genName;

function shrink(im){
  const w=768,h=Math.round(im.height*w/im.width);
  const c=document.createElement('canvas');c.width=w;c.height=h;
  const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);
  x.drawImage(im,0,0,w,h);
  return c.toDataURL('image/jpeg',.85).split(',')[1];
}
function prevImage(i){
  for(let j=i-1;j>=0;j--) if(imgs[j]) return imgs[j];
  return null;
}
async function drawOne(i){
  const k=S.koma[i],st=$(`[data-ks="${i}"]`),err=$('#drawErr');err.classList.add('hide');
  if(!k.art){err.textContent=`${i+1}コマ目の「絵」が空です。`;err.classList.remove('hide');return;}
  const pv=$('#chain').checked?prevImage(i):null;
  st.innerHTML='<span class="spin"></span>'+(pv?'前のコマに合わせて描いています':'描いています')+'（1分ほど）';
  try{
    const body={mode:'image',shot:k.shot||'バストアップ',
      face:(k.face||'基本')+'　'+(FACE_RULE[k.face||'基本']||''),
      art:k.art,lines:k.lines.filter(Boolean).map(l=>'「'+l+'」').join('　')||'なし'};
    if(pv) body.prev=shrink(pv);
    const r=await fetch(HOOK,{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('通信に失敗しました（'+r.status+'）');
    const bl=await r.blob();
    if(bl.type.indexOf('image')<0)throw new Error('画像が返りませんでした。もう一度押してください。');
    const im=new Image();
    await new Promise((res,rej)=>{im.onload=res;im.onerror=rej;im.src=URL.createObjectURL(bl);});
    imgs[i]=im;st.textContent='できました';render();
  }catch(e){st.textContent='';err.textContent=`${i+1}コマ目：`+e.message;err.classList.remove('hide');}
}

$('#all').onclick=async()=>{
  const b=$('#all'),st=$('#allState');
  b.disabled=true;$('#gen').disabled=true;
  const step=t=>{st.innerHTML='<span class="spin"></span>'+t;};
  try{
    step('ネームを考えています…（1/6）');
    const ok=await genName();
    if(!ok){st.textContent='';b.disabled=false;$('#gen').disabled=false;return;}
    for(let i=0;i<4;i++){
      step(`${i+1}コマ目を描いています…（${i+2}/6）　残り約${(4-i)}分`);
      await drawOne(i);
      if(!imgs[i]){st.innerHTML='<span style="color:#DC2626">'+
        `${i+1}コマ目でつまずきました。そのコマの「このコマを描く」を押してください。</span>`;
        b.disabled=false;$('#gen').disabled=false;return;}
    }
    step('版下に組んでいます…（6/6）');
    await new Promise(r=>setTimeout(r,300));
    exportPng();
    st.innerHTML='<span style="color:#16A34A">できました。版下をダウンロードしました。</span>';
  }catch(e){st.innerHTML='<span style="color:#DC2626">'+e.message+'</span>';}
  b.disabled=false;$('#gen').disabled=false;
};

$('#drawAll').onclick=async()=>{
  const b=$('#drawAll');b.disabled=true;
  for(let i=0;i<4;i++){$('#drawState').textContent=`${i+1}コマ目を描いています…`;await drawOne(i);}
  $('#drawState').textContent='';b.disabled=false;
};

function exportPng(){
  const k=$('#x2').checked?2:1;
  const c=document.createElement('canvas');c.width=W*k;c.height=TH*k;
  const x=c.getContext('2d');x.imageSmoothingQuality='high';
  x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);
  let y=0;
  imgs.forEach((im,i)=>{
    const tgt=W/PH,src=im.width/im.height;
    let sx=0,sy=0,sw=im.width,sh=im.height;
    if(src>tgt){sw=im.height*tgt;sx=(im.width-sw)/2;}
    else if(src<tgt){sh=im.width/tgt;sy=(im.height-sh)/2;}
    x.drawImage(im,sx,sy,sw,sh,0,y*k,W*k,PH*k);
    x.strokeStyle='#000';x.lineWidth=BD*k;
    x.strokeRect(BD*k/2,y*k+BD*k/2,W*k-BD*k,PH*k-BD*k);
    y+=PH;
    if(i<3){const n=(S.notes[i]||'').trim();
      if(n){x.fillStyle='#000';x.font=(21*k)+'px "Noto Sans JP",sans-serif';
        x.textAlign='right';x.textBaseline='top';x.fillText(n,(W-8)*k,(y+12)*k);}
      y+=G;}
  });
  c.toBlob(b=>{const a=document.createElement('a');a.href=URL.createObjectURL(b);
    a.download=(S.issue?S.issue.replace(/[\/\\:*?"<>|\s]/g,'_'):'fumufumu')+'_4koma.png';
    a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);},'image/png');
}
$('#dl').onclick=exportPng;

const cw=$('#checks');
CHECKS.forEach(t=>{const l=document.createElement('label');l.className='chk';
  l.innerHTML=`<input type="checkbox"><span>${t}</span>`;
  l.querySelector('input').onchange=e=>{l.style.opacity=e.target.checked?.5:1;};
  cw.appendChild(l);});

load();
</script>
